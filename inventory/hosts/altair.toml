name = "altair"
hostname = "altair"

platform = "linux"
variant = "ubuntu"

role = "tinker"
description = "Ubuntu Sandbox"

groups = ["docker"]

[management]
provisioner = "terraform"
converger = "ansible"

[runtime]
kind = "vm"
hypervisor = "proxmox"
node = "sirius"

[resources.cpu]
cores = 4
sockets = 1

[resources]
memory_mb = 4096
disk_gb = 32

[network]
mode = "static"
dns = ["192.168.10.1"]

[network.ipv4]
address = "192.168.10.109"
gateway = "192.168.10.1"

[provisioning.terraform]
cloud_init = true
agent = false
