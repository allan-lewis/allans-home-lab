name = "deneb"
hostname = "deneb"

platform = "nixos"
variant = "nixos"

role = "tinker"
description = "NixOS Sandbox"

groups = ["nixos"]

[management]
provisioner = "terraform"
converger = "nixos"

[runtime]
kind = "vm"
hypervisor = "proxmox"
node = "sirius"

[resources.cpu]
cores = 4
sockets = 1

[resources]
memory_mb = 4096
disk_gb = 32

[network]
mode = "static"
dns = ["192.168.10.1"]

[network.ipv4]
address = "192.168.10.108"
gateway = "192.168.10.1"

[provisioning.terraform]
cloud_init = true
agent = true
