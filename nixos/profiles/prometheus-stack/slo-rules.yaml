groups:
  - name: homelab.slo
    interval: 5m
    rules:
      - record: homelab_slo_1h
        expr: |
          sum by (name, key, group) (increase(gatus_results_total{success="true"}[1h]))
          /
          sum by (name, key, group) (increase(gatus_results_total[1h]))

      - record: homelab_slo_7d
        expr: |
          sum by (name, key, group) (increase(gatus_results_total{success="true"}[7d]))
          /
          sum by (name, key, group) (increase(gatus_results_total[7d]))

      - record: homelab_slo_28d
        expr: |
          sum by (name, key, group) (increase(gatus_results_total{success="true"}[28d]))
          /
          sum by (name, key, group) (increase(gatus_results_total[28d]))
